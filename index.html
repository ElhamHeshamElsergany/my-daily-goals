<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today — daily goals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div class="brand">
          <p class="eyebrow">Daily goals</p>
          <div class="title-row">
            <button class="nav-btn" id="prev-day" type="button" aria-label="Previous day">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div>
              <h1 id="weekday">Monday</h1>
              <p class="full-date" id="full-date">August 25, 2026</p>
            </div>
            <button class="nav-btn" id="next-day" type="button" aria-label="Next day">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <button class="today-jump" id="jump-today" type="button" hidden>Jump to today</button>
        </div>
        <div class="streak" id="streak" hidden>
          <span class="streak-count" id="streak-count">0</span>
          <span class="streak-label">day streak</span>
        </div>
      </header>

      <nav class="week" id="week" aria-label="This week"></nav>

      <section class="progress-card" id="progress-card" aria-live="polite">
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
          <path
            class="ring-bg"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
          />
          <path
            class="ring-fg"
            id="ring-fg"
            pathLength="100"
            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
          />
        </svg>
        <div>
          <p class="progress-kicker" id="progress-kicker">No goals yet</p>
          <p class="progress-copy" id="progress-copy">Write what would make today count.</p>
        </div>
      </section>

      <form class="add-form" id="add-form">
        <input
          id="add-input"
          name="goal"
          type="text"
          maxlength="140"
          autocomplete="off"
          placeholder="Add a goal for this day…"
          aria-label="New goal"
        />
        <button type="submit">Add</button>
      </form>

      <ul class="goals" id="goals"></ul>
      <p class="empty" id="empty">Nothing here yet. Add the first thing you want to finish.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
